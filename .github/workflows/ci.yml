name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Poți seta variabile globale aici, ex: versiunea de Clang
  CLANG_VER: '18'
  # Directorul de build standard
  BUILD_DIR: 'build'
  # Directorul cu dependințe externe
  EXT_DIR: 'external'

jobs:
  #================================================
  # JOB 1: Construiește proiectul
  #================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Important dacă folosești submodule

      - name: Install system packages
        uses: ./.github/actions/install-packages

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
          "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure CMake
        uses: ./.github/actions/configure-cmake
        with:
          # Poți adăuga flag-uri specifice pentru build-ul de CI
          custom_flags: '-G Ninja'
          cache_key: 'cache-deps-build'

      - name: Build project
        run: cmake --build ${{ env.BUILD_DIR }}

      - name: Upload build artifacts
        # Acest pas "salvează" folderul de build pentru a fi folosit în alte job-uri
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.BUILD_DIR }}/

  #================================================
  # JOB 2: Analiză Statică
  #================================================
  static-analysis:
    runs-on: ubuntu-latest
    # Rulează în paralel cu job-ul de "build"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Run Clang-Tidy
        uses: ./.github/actions/clang-tidy

      - name: Run Cppcheck
        uses: ./.github/actions/cppcheck

  #================================================
  # JOB 3: Verificări la Rulare (ex: Sanitizers)
  #================================================
  runtime-checks:
    runs-on: ubuntu-latest
    # 'needs: build' asigură că acest job pornește DOAR DUPĂ ce job-ul 'build' s-a terminat cu succes
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Download build artifacts
        # Preia folderul de build salvat de job-ul anterior
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ env.BUILD_DIR }}/

      - name: Run runtime checks
        uses: ./.github/actions/runtime-checks
