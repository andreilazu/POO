name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build g++ cmake \
            libxi-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev libudev-dev libdbus-1-dev \
            libfreetype-dev libharfbuzz-dev

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
          "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build

      - name: Run academic demo
        run: ./build/pikmin_swarm --demo
